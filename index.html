    <script>
      (() => {
        const root = document.documentElement
        // Motion is on by default. Only a saved, explicit visitor pause disables it.
        root.dataset.motionOverride = 'on'
        root.dataset.motion = 'on'
        try {
          const savedTheme = (() => { try { return localStorage.getItem('legion-portfolio-theme') } catch { return null } })()
          const theme = savedTheme === 'light' ? 'light' : 'dark'
          document.documentElement.dataset.theme = theme
          const themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) themeColor.content = theme === 'light' ? '#f3f0e9' : '#151719'

          const hints = navigator
          const saveData = Boolean(hints.connection && hints.connection.saveData)
          const reducedGraphics = saveData || (hints.deviceMemory && hints.deviceMemory <= 2) || (hints.hardwareConcurrency && hints.hardwareConcurrency <= 2)
          const coarsePointer = window.matchMedia?.('(pointer: coarse)').matches ?? (navigator.maxTouchPoints > 0)
          document.documentElement.dataset.quality = reducedGraphics ? 'economy' : (coarsePointer ? 'balanced' : 'full')
          document.documentElement.dataset.orientation = innerWidth >= innerHeight ? 'landscape' : 'portrait'

          const savedMotion = (() => { try { return localStorage.getItem('legion-portfolio-motion-v7') } catch { return null } })()
          const motionOverride = savedMotion === 'off' ? 'off' : 'on'
          const motionEnabled = savedMotion !== 'off'
          root.dataset.motionOverride = motionOverride
          root.dataset.motion = motionEnabled ? 'on' : 'off'
        } catch {
          // Theme and motion preferences remain usable when storage is unavailable.
        }
      })()
    </script>
