name: Verify and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-vite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.16.x

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify Supabase portfolio backend readiness
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            https://pjuwrngnrrvdiwqspkic.supabase.co/functions/v1/portfolio-submit)"
          echo "$response" | jq -e '.ok == true and .status == "ready"'

      - name: Set up Python test environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Run complete source, type, build, and browser verification
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://pjuwrngnrrvdiwqspkic.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_PRGb0-smtTzCm9VHuM9NOQ_ZFh1wKRS' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || secrets.VITE_TURNSTILE_SITE_KEY }}
        run: npm run verify

      - name: Run Lighthouse audits on the full site and recruiter view
        run: lhci autorun

      # Vite has already compiled the React application into dist/.
      # Publish that directory directly; the Jekyll pass is unnecessary and
      # can alter permissions on GitHub-hosted runners.
      - name: Validate the production Pages artifact
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/favicon.svg
          test -s dist/favicon-32.png
          test -s dist/favicon.ico
          grep -q '/favicon.svg?v=20261109-3' dist/index.html
          grep -q '/favicon-32.png?v=20261109-3' dist/index.html
          grep -q '/favicon.ico?v=20261109-3' dist/index.html
          test -s dist/site.webmanifest
          test -d dist/assets
          test -s dist/King-Art-Pacumberto-CV.pdf
          test -s dist/King-Art-Pacumberto-Resume.pdf
          test -f dist/.nojekyll

          # Reject the raw Vite development shell: production must use
          # compiled, hashed JavaScript and CSS bundles.
          grep -Eq '<script[^>]+src="/assets/index-[^"]+\.js"' dist/index.html
          grep -Eq '<link[^>]+href="/assets/index-[^"]+\.css"' dist/index.html
          ! grep -q 'src="/src/main.tsx"' dist/index.html

          js_asset="$(grep -oE '/assets/index-[^"]+\.js' dist/index.html | head -n 1 | sed 's#^/##')"
          css_asset="$(grep -oE '/assets/index-[^"]+\.css' dist/index.html | head -n 1 | sed 's#^/##')"
          test -n "$js_asset" && test -s "dist/$js_asset"
          test -n "$css_asset" && test -s "dist/$css_asset"

      - name: Save private Lighthouse reports to the workflow run
        if: always() && hashFiles('.lighthouseci/reports/**/*.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 14

      - name: Upload compiled Vite Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    needs: verify-and-package
    steps:
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
